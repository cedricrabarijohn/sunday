name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WIKOLABS_VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.WIKOLABS_VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Pull code and restart on VM
        env:
          SSH_OPTS: "-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=5 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
        run: |
          attempt=1
          until [ $attempt -gt 4 ]; do
            echo "::group::Deploy attempt $attempt"
            if ssh $SSH_OPTS \
                 ${{ secrets.WIKOLABS_VM_USER }}@${{ secrets.WIKOLABS_VM_HOST }} \
                 'bash -s' <<'DEPLOY'; then
              set -e
              cd /root/sunday
              git fetch --all
              git reset --hard origin/main
              # Override file at docker/docker-compose.production.yml maps the app to host port 3060 and keeps internal services internal-only.
              docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.production.yml up -d --build app db minio minio-init mailpit
              sleep 6
              if docker ps --format '{{.Names}}' | grep -q sunday_app; then
                echo "Sunday deployed at $(date) on http://${{ secrets.WIKOLABS_VM_HOST }}:3060"
              else
                echo "Sunday app failed to start" >&2
                docker logs --tail 50 sunday_app || true
                exit 1
              fi
DEPLOY
              echo "::endgroup::"
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "Deploy attempt $attempt failed, retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
          done
          echo "Deploy failed after 4 attempts" >&2
          exit 1
