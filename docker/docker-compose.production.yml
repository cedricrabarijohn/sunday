# Production override · use alongside docker-compose.yml:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.production.yml up -d --build
# (or `make start-prod`). Differences vs the dev compose file:
#   - Runs the app in production mode (build + start instead of the dev server).
#   - Internal services (db, mailpit, and MinIO when the s3 profile is on) are NOT
#     published on host ports — only the app is reachable from outside.
#   - The app host port is configurable via APP_PORT (default 3000); put a TLS
#     reverse proxy (Traefik / nginx / Caddy) in front and set APP_URL to the
#     public https URL.

services:
  db:
    ports: !reset []

  minio:
    ports: !reset []

  mailpit:
    ports: !reset []

  app:
    environment:
      - APP_ENV=production
    ports: !override
      - "${APP_PORT:-3000}:3000"
